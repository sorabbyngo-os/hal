[package]
name = "hal"
version = "0.1.0"
edition = "2021"
authors = ["Sorabbyngo OS Team"]
description = "Hardware Abstraction Layer for Sorabbyngo OS"

[dependencies]
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
nix = "0.27"
